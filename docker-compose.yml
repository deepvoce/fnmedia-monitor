version: '3.8'

services:
  fnmedia-monitor:
    image: deepvoce/fnmedia-monitor:v2.0
    container_name: fnmedia-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FNMEDIA_DB_PATH=/app/database/trimmedia.db
      - LOG_PATH=/app/logs
      - DB_COPY_TTL=60
      - LOG_ENABLED=0
      - TZ=Asia/Shanghai
    volumes:
      # 只读挂载数据库目录（避免容器内写入）
      - /usr/local/apps/@appdata/trim.media/database:/app/database:ro
    mem_limit: 200m
    cpus: 0.5
